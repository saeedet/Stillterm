[workspace]
members = ["crates/engine", "crates/terminal", "crates/macos-bridge", "crates/windows"]
default-members = ["crates/terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/saeedet/Stillterm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
