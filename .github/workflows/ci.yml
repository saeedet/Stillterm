name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify reproducible preview
        run: |
          cargo run --quiet --locked -p stillterm-engine --example snapshot > "$RUNNER_TEMP/rain.svg"
          diff -u docs/media/rain.svg "$RUNNER_TEMP/rain.svg"
          cargo run --quiet --locked -p stillterm-engine --example snapshot -- matrix > "$RUNNER_TEMP/matrix.svg"
          diff -u docs/media/matrix.svg "$RUNNER_TEMP/matrix.svg"

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Verify terminal lifecycle
        if: runner.os != 'Windows'
        run: |
          python3 scripts/check-terminal.py --panic-check
          python3 scripts/check-terminal.py --theme matrix

      - name: Check Windows native adapter
        if: runner.os == 'Windows'
        run: cargo clippy -p stillterm-windows --all-targets --locked -- -D warnings
      - name: Package and check Windows screensaver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          ./scripts/check-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: Stillterm-windows-development
          path: |
            target/windows/Stillterm-windows-development.zip
            target/windows/SHA256SUMS.txt
          retention-days: 14

  macos-bundle:
    name: macOS universal bundle
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/build-macos.sh
      - run: scripts/check-macos.sh
      - name: Archive development bundle
        run: ditto -c -k --sequesterRsrc --keepParent target/macos/Stillterm.saver target/macos/Stillterm-development.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Stillterm-macos-development
          path: target/macos/Stillterm-development.zip
          retention-days: 14
