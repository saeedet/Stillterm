[package]
name = "stillterm"
description = "Quiet, deterministic character animation for your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stillterm-engine = { path = "../engine", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true

