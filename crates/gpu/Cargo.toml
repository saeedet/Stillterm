[package]
name = "stillterm-gpu"
description = "Experimental GPU corridor renderer for Stillterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
stillterm-engine = { path = "../engine" }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "24.0.5", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"

[dev-dependencies]
naga = { version = "24.0.0", features = ["wgsl-in"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
